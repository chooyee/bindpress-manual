name: Bug report
description: Something does not work or render as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: The manual JSON that shows it
      description: The smallest manual that shows the problem helps most. Remove anything private.
      render: json
  - type: input
    id: version
    attributes:
      label: "@bindpress/manual version"
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system (for reader or styling problems)
      placeholder: Chrome 131 on Windows 11
